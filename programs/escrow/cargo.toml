[package]
name = "escrow"
version = "0.1.0"
description = "Token escrow program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "escrow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = [
    "anchor-lang/idl-build",
    "anchor-spl/idl-build"
]

[dependencies]
anchor-lang = "0.31.0"
anchor-spl = "0.31.0"

[dev-dependencies]
litesvm = "0.6.1"
litesvm-token = "0.6.1"
solana-sdk = "2.2.0"